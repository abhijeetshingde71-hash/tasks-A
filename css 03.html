<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing Plans</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;background:#0f172a;font-family:Segoe UI,Arial,sans-serif;padding:50px 20px;color:#fff}
  h1{text-align:center;margin-bottom:40px}
  .plans{display:flex;flex-wrap:wrap;gap:24px;justify-content:center}
  .plan{width:290px;background:#1e293b;border-radius:16px;padding:32px 24px;text-align:center;
        border-top:6px solid var(--c);transition:.35s}
  .plan:hover{transform:translateY(-12px);box-shadow:0 20px 40px var(--c)}
  .plan.basic{--c:#38bdf8}.plan.pro{--c:#a78bfa}.plan.premium{--c:#fbbf24}
  .plan h2{color:var(--c)}
  .price{font-size:2.6rem;font-weight:800;margin:16px 0}
  .price small{font-size:1rem;color:#94a3b8}
  ul{list-style:none;margin-bottom:24px}
  li{padding:10px 0;border-bottom:1px solid #334155;color:#cbd5e1}
  button{padding:12px 30px;border:2px solid var(--c);background:transparent;color:var(--c);
         border-radius:30px;font-size:1rem;cursor:pointer;transition:.3s}
  button:hover{background:var(--c);color:#0f172a}
</style>
</head>
<body>
  <h1>Choose Your Plan</h1>
  <div class="plans">
    <div class="plan basic">
      <h2>Basic</h2><div class="price">₹199<small>/mo</small></div>
      <ul><li>1 Project</li><li>5 GB Storage</li><li>Email Support</li></ul>
      <button>Get Started</button>
    </div>
    <div class="plan pro">
      <h2>Pro</h2><div class="price">₹499<small>/mo</small></div>
      <ul><li>10 Projects</li><li>50 GB Storage</li><li>Priority Support</li></ul>
      <button>Get Started</button>
    </div>
    <div class="plan premium">
      <h2>Premium</h2><div class="price">₹999<small>/mo</small></div>
      <ul><li>Unlimited Projects</li><li>500 GB Storage</li><li>24/7 Support</li></ul>
      <button>Get Started</button>
    </div>
  </div>
</body>
</html>
