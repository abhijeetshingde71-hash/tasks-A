<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0f172a;color:#fff;font-family:Segoe UI,Arial,sans-serif;padding:40px 20px}
  h1{text-align:center;margin-bottom:30px}
  .progress{max-width:600px;margin:0 auto 40px;background:#334155;border-radius:20px;height:16px;overflow:hidden}
  .bar{height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#a78bfa);border-radius:20px;animation:fill 2.5s forwards}
  @keyframes fill{to{width:75%}}
  .timeline{position:relative;max-width:700px;margin:auto;padding:10px 0}
  .timeline::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;background:#475569;transform:translateX(-50%)}
  .step{position:relative;width:50%;padding:0 30px 40px;opacity:0;animation:slide .8s forwards}
  .step:nth-child(odd){left:0;text-align:right;transform:translateX(-40px)}
  .step:nth-child(even){left:50%;transform:translateX(40px)}
  .step:nth-child(1){animation-delay:.3s}.step:nth-child(2){animation-delay:.7s}
  .step:nth-child(3){animation-delay:1.1s}.step:nth-child(4){animation-delay:1.5s}
  @keyframes slide{to{opacity:1;transform:translateX(0)}}
  .step::after{content:"";position:absolute;top:10px;width:20px;height:20px;border-radius:50%;background:#22d3ee;border:4px solid #0f172a}
  .step:nth-child(odd)::after{right:-10px}
  .step:nth-child(even)::after{left:-10px}
  .box{background:#1e293b;padding:16px;border-radius:12px;transition:.3s}
  .box:hover{transform:scale(1.05);background:#334155}
  .box span{color:#22d3ee;font-size:13px}
  @media(max-width:600px){
    .timeline::before{left:20px}
    .step,.step:nth-child(even){width:100%;left:0;text-align:left;padding-left:50px}
    .step:nth-child(odd)::after,.step:nth-child(even)::after{left:10px;right:auto}
  }
</style>
</head>
<body>
  <h1>Project Progress</h1>
  <div class="progress"><div class="bar"></div></div>
  <div class="timeline">
    <div class="step"><div class="box"><span>January</span><h3>Planning</h3><p>Requirements and design finalised.</p></div></div>
    <div class="step"><div class="box"><span>March</span><h3>Development</h3><p>Core features built and tested.</p></div></div>
    <div class="step"><div class="box"><span>May</span><h3>Testing</h3><p>Bug fixing and performance checks.</p></div></div>
    <div class="step"><div class="box"><span>July</span><h3>Launch</h3><p>Product goes live.</p></div></div>
  </div>
</body>
</html>
