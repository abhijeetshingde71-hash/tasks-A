<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Showcase</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Segoe UI,Arial,sans-serif;background:#f8fafc;padding:40px 20px}
  h1{text-align:center;margin-bottom:30px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;max-width:1100px;margin:auto}
  .product{position:relative;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08);transition:.35s}
  .product:hover{transform:translateY(-10px);box-shadow:0 18px 30px rgba(0,0,0,.15)}
  .product img{width:100%;height:200px;object-fit:cover;transition:transform .4s}
  .product:hover img{transform:scale(1.07)}
  .imgbox{overflow:hidden}
  .badge{position:absolute;top:12px;left:12px;background:#ef4444;color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
  .badge.new{background:#22c55e}
  .info{padding:16px}
  .info h3{margin-bottom:8px}
  .price{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .price .now{font-size:1.3rem;font-weight:700;color:#0f172a}
  .price .old{text-decoration:line-through;color:#94a3b8}
  .price .off{background:#fef3c7;color:#b45309;padding:2px 8px;border-radius:6px;font-size:12px}
  button{width:100%;padding:10px;border:0;border-radius:8px;background:#0f172a;color:#fff;cursor:pointer;transition:.3s}
  button:hover{background:#f97316;letter-spacing:1px}
</style>
</head>
<body>
  <h1>Featured Products</h1>
  <div class="grid">
    <div class="product"><span class="badge">SALE</span>
      <div class="imgbox"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT3winONbCaZV24mWhfHFKwr3mvQn2STWp7ZsRsL-HXqw&s=10" alt=""></div>
      <div class="info"><h3>Wireless Headphones</h3>
        <div class="price"><span class="now">₹1,999</span><span class="old">₹2,999</span><span class="off">33% OFF</span></div>
        <button>Add to Cart</button></div></div>
    <div class="product"><span class="badge new">NEW</span>
      <div class="imgbox"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQFPuLqbqp0rRFawpCZxwKy6XKfxNwnduhi6L1t61HNyQ&s" alt=""></div>
      <div class="info"><h3>Smart Watch</h3>
        <div class="price"><span class="now">₹3,499</span><span class="old">₹4,999</span><span class="off">30% OFF</span></div>
        <button>Add to Cart</button></div></div>
    <div class="product"><span class="badge">HOT</span>
      <div class="imgbox"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTxAVdjJJYiua4jXxKA9oJ49rA-LvEq0rfYhoM2gDmnPw&s=10" alt=""></div>
      <div class="info"><h3>Backpack</h3>
        <div class="price"><span class="now">₹899</span><span class="old">₹1,299</span><span class="off">31% OFF</span></div>
        <button>Add to Cart</button></div></div>
  </div>
</body>
</html>
